services:
  tgc.regardedstonks.api:
    image: tgc.regardedstonks.api
    build:
      context: .
      dockerfile: TGC.RegardedStonks.Api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "9876:8080"
  postgres:
    image: postgres
    container_name: my_postgres
    environment:
      POSTGRES_PASSWORD: mysecretpassword
    ports:
      - "5432:5432"
  
  pgadmin:
    image: dpage/pgadmin4:9.8
    ports:
      - 5050:80
    environment:
      # Required by pgAdmin
      PGADMIN_DEFAULT_EMAIL: demo@example.com
      PGADMIN_DEFAULT_PASSWORD: secret
      
      # Don't require the user to login
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      
      # Don't require a "master" password after logging in
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
