<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content class="confirm-dialog-content">
  <p>{{ data.message }}</p>
  @if (error()) {
    <p class="confirm-dialog-error">{{ error() }}</p>
  }
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" [disabled]="submitting()" (click)="cancel()">{{ data.cancelLabel ?? 'Cancel' }}</button>
  <button mat-flat-button color="warn" type="button" [disabled]="submitting()" (click)="confirm()">
    @if (submitting()) {
      <mat-spinner diameter="18" />
    } @else {
      {{ data.confirmLabel ?? 'Confirm' }}
    }
  </button>
</mat-dialog-actions>
